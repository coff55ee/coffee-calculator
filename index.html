<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f7f5">
<title>コーヒー抽出計算機</title>
<style>
  :root{color-scheme:light;--bg:#f7f7f5;--paper:#fff;--text:#131313;--muted:#696966;--border:#dddcd8;--soft:#f1f1ef}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;min-width:290px;background:var(--bg);color:var(--text);padding:14px 12px 28px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
  .card{max-width:720px;margin:0 auto;padding:27px 28px 29px;background:var(--paper);border:1px solid var(--border);border-radius:25px}
  h1{font-size:clamp(25px,5.2vw,35px);line-height:1.25;letter-spacing:.008em;font-weight:800;margin:0 0 31px}
  label{display:block;color:var(--muted);font-size:clamp(18px,4vw,23px);font-weight:700;margin-bottom:14px}
  #beans{display:block;width:100%;height:77px;padding:0 27px;border:2px solid #d8d8d5;border-radius:100px;background:#fff;color:var(--text);font:inherit;font-size:28px;font-weight:500;outline:none;font-variant-numeric:tabular-nums}
  #beans:focus{border-color:#777}
  .summary{background:var(--soft);border-radius:20px;padding:19px 22px 20px;margin-top:29px}
  .summary-label{font-size:18px;color:var(--muted);margin-bottom:6px}
  .summary-value{font-size:clamp(38px,7vw,51px);font-weight:800;line-height:1.18;font-variant-numeric:tabular-nums}
  h2{font-size:clamp(22px,4.5vw,29px);font-weight:800;margin:32px 0 19px}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;table-layout:fixed}
  th,td{padding:17px 4px;border-bottom:1px solid #dededb;font-size:clamp(15px,3.4vw,23px);white-space:nowrap}
  th{border-bottom:2px solid var(--border);font-weight:750;text-align:left}
  th:nth-child(1),td:nth-child(1){width:25%}
  th:nth-child(2),td:nth-child(2){width:19%}
  th:nth-child(3),td:nth-child(3){width:28%;text-align:right}
  th:nth-child(4),td:nth-child(4){width:28%;text-align:right}
  tbody tr:last-child td{border-bottom:none}
  .note{display:flex;gap:12px;margin:24px 0 0;color:var(--muted);line-height:1.65;font-size:clamp(14px,3.3vw,17px)}
  .clock{flex:0 0 auto;font-size:21px;line-height:1.3}
  .error{margin:12px 0 0;font-size:14px;color:#a34531;line-height:1.5}
  .nojs{margin-top:18px;color:#a34531;font-size:14px;line-height:1.65}
  @media(max-width:440px){.card{padding:24px 16px 23px;border-radius:22px}h1{margin-bottom:27px}#beans{height:70px;padding:0 23px;font-size:25px}.summary{margin-top:24px;padding:18px 19px}h2{margin-top:30px}th,td{padding:15px 1px}}
  @media(max-width:350px){.card{padding:20px 12px}th,td{font-size:14px}.note{font-size:13px}}
</style>
</head>
<body>
  <main class="card">
    <h1>コーヒー抽出計算機</h1>
    <label for="beans">コーヒー豆の重さ (g)</label>
    <input id="beans" type="number" inputmode="decimal" min="1" max="100" step="0.1" value="20" aria-describedby="inputError">
    <div id="inputError" class="error" role="status" hidden></div>

    <div class="summary" aria-live="polite" aria-atomic="true">
      <div class="summary-label">総湯量</div>
      <div class="summary-value" id="total">310g</div>
    </div>

    <h2>4投の抽出スケジュール</h2>
    <table aria-label="4投の抽出スケジュール">
      <thead><tr><th scope="col">投湯</th><th scope="col">開始</th><th scope="col">注ぐ量</th><th scope="col">累計</th></tr></thead>
      <tbody id="schedule">
        <tr><td>1投目</td><td>0:00</td><td>46.5g</td><td>46.5g</td></tr>
        <tr><td>2投目</td><td>0:40</td><td>77.5g</td><td>124g</td></tr>
        <tr><td>3投目</td><td>1:20</td><td>93g</td><td>217g</td></tr>
        <tr><td>4投目</td><td>2:00</td><td>93g</td><td>310g</td></tr>
      </tbody>
    </table>

    <p class="note"><span class="clock" aria-hidden="true">◷</span><span id="note">抽出完了の目安：2分45秒〜3分45秒（豆20gの場合。器具や挽き目によって変わります）</span></p>
    <noscript><p class="nojs">この画面では自動計算できません。JavaScriptが動作するブラウザ（Safariなど）で開いてください。表示されている値は豆20gの例です。</p></noscript>
  </main>
<script>
(function () {
  'use strict';
  var input = document.getElementById('beans');
  var totalEl = document.getElementById('total');
  var schedule = document.getElementById('schedule');
  var note = document.getElementById('note');
  var error = document.getElementById('inputError');
  var rows = Array.prototype.slice.call(schedule.querySelectorAll('tr'));
  var times = ['0:00', '0:40', '1:20', '2:00'];
  var ratios = [0.15, 0.40, 0.70, 1.00];
  function r1(n){return Math.round((n + Number.EPSILON) * 10) / 10;}
  function gram(n){return (Math.abs(n - Math.round(n)) < 0.00001 ? String(Math.round(n)) : n.toFixed(1)) + 'g';}
  function resetInvalid(){
    totalEl.textContent = '—';
    for (var i = 0; i < 4; i++) {
      rows[i].cells[2].textContent = '—';
      rows[i].cells[3].textContent = '—';
    }
    note.textContent = '豆量を入力すると注湯量を表示します。';
    error.hidden = false;
    error.textContent = '豆量は1〜100gで入力してください。';
  }
  function render(){
    var s = input.value.trim();
    var beans = Number(s);
    if (!s || !Number.isFinite(beans) || beans < 1 || beans > 100) {
      resetInvalid();
      return;
    }
    error.hidden = true;
    var total = r1(beans * 15.5);
    var last = 0;
    totalEl.textContent = gram(total);
    for (var i = 0; i < 4; i++) {
      var cumulative = (i === 3 ? total : r1(total * ratios[i]));
      var quantity = r1(cumulative - last);
      rows[i].cells[0].textContent = (i + 1) + '投目';
      rows[i].cells[1].textContent = times[i];
      rows[i].cells[2].textContent = gram(quantity);
      rows[i].cells[3].textContent = gram(cumulative);
      last = cumulative;
    }
    var timeText = beans <= 15 ? '2分30秒〜3分30秒' : '2分45秒〜3分45秒';
    note.textContent = '抽出完了の目安：' + timeText + '（豆' + gram(beans) + 'の場合。器具や挽き目によって変わります）';
  }
  input.addEventListener('input', render);
  input.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f7f5">
<title>コーヒー抽出計算機</title>
<style>
:root {color-scheme:light;--bg:#f7f7f5;--paper:#fff;--text:#131313;--muted:#696966;--border:#dddcd8;--soft:#f1f1ef;--accent:#474c41}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-width:290px;background:var(--bg);color:var(--text);padding:14px 12px 36px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
.card{max-width:720px;margin:0 auto;padding:27px 28px 31px;background:var(--paper);border:1px solid var(--border);border-radius:25px}
h1{font-size:clamp(25px,5.2vw,35px);line-height:1.25;letter-spacing:.008em;font-weight:800;margin:0 0 23px}
h2{font-size:clamp(21px,4.5vw,27px);font-weight:800;margin:28px 0 15px}
h3{font-size:19px;margin:24px 0 12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border-radius:17px;margin-bottom:26px}
.tab{appearance:none;border:0;border-radius:13px;background:transparent;color:var(--muted);font:inherit;font-size:clamp(15px,3.2vw,18px);font-weight:700;padding:14px 5px;cursor:pointer;min-height:48px}
.tab[aria-selected="true"]{color:var(--text);background:#fff;box-shadow:0 1px 5px #00000013}
.tab:focus-visible,input:focus-visible{outline:3px solid #8f9f84;outline-offset:2px}
label{display:block;color:var(--muted);font-size:clamp(17px,3.7vw,21px);font-weight:700;margin-bottom:13px}
#beans{display:block;width:100%;height:71px;padding:0 25px;border:2px solid #d8d8d5;border-radius:100px;background:#fff;color:var(--text);font:inherit;font-size:27px;font-weight:500;outline:none;font-variant-numeric:tabular-nums}
.field{margin:0 0 19px}
.summary{background:var(--soft);border-radius:20px;padding:19px 22px 20px;margin-top:24px}
.summary-label{font-size:18px;color:var(--muted);margin-bottom:6px}
.summary-value{font-size:clamp(38px,7vw,51px);font-weight:800;line-height:1.18;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;table-layout:fixed}
th,td{padding:17px 4px;border-bottom:1px solid #dededb;font-size:clamp(15px,3.4vw,22px);white-space:nowrap}
th{border-bottom:2px solid var(--border);font-weight:750;text-align:left}
th:nth-child(1),td:nth-child(1){width:25%}
th:nth-child(2),td:nth-child(2){width:19%}
th:nth-child(3),td:nth-child(3){width:28%;text-align:right}
th:nth-child(4),td:nth-child(4){width:28%;text-align:right}
tbody tr:last-child td{border-bottom:none}
.error{margin:12px 0 0;font-size:14px;color:#a34531;line-height:1.5}
[hidden]{display:none!important}
@media(max-width:440px){.card{padding:24px 16px 23px;border-radius:22px}h1{margin-bottom:22px}#beans{height:70px;padding:0 23px;font-size:25px}.summary{margin-top:22px;padding:18px 19px}th,td{padding:15px 1px}}
@media(max-width:350px){.card{padding:20px 12px}th,td{font-size:14px}/* Separate grid prevents the four-column hand-drip table rules from affecting French press. */
.press-grid{width:100%;min-width:0;font-variant-numeric:tabular-nums}
.press-grid-row{display:grid;grid-template-columns:22% minmax(0,1fr);align-items:center;width:100%;min-width:0;border-bottom:1px solid #dededb}
.press-grid-row:last-child{border-bottom:0}
.press-grid-head{border-bottom:2px solid var(--border);font-weight:750}
.press-grid-row>[role]{min-width:0;padding:17px 4px;font-size:clamp(15px,3.4vw,22px);line-height:1.35}
.press-grid-row>[role]:last-child{white-space:normal;overflow-wrap:anywhere;word-break:normal}
.press-grid-row>[role]:first-child{white-space:nowrap}
@media(max-width:350px){.press-grid-row>[role]{font-size:14px;padding:14px 3px}}
</style>
</head>
<body>
<main class="card">
  <h1>コーヒー抽出計算機</h1>
  <div class="tabs" role="tablist" aria-label="抽出方法を選択">
    <button class="tab" id="tab-drip" role="tab" aria-controls="panel-drip" aria-selected="true" type="button">ハンドドリップ</button>
    <button class="tab" id="tab-press" role="tab" aria-controls="panel-press" aria-selected="false" tabindex="-1" type="button">フレンチプレス</button>
  </div>
  <div class="field">
    <label for="beans">コーヒー豆の重さ (g)</label>
    <input id="beans" type="number" inputmode="decimal" min="1" max="100" step="0.1" value="20" aria-describedby="inputError">
    <p id="inputError" class="error" role="status" hidden></p>
  </div>

  <section id="panel-drip" role="tabpanel" aria-labelledby="tab-drip">
    <div class="summary" aria-live="polite" aria-atomic="true">
      <div class="summary-label">総湯量｜粉湯比 1:15.5</div>
      <div class="summary-value" id="drip-total">310g</div>
    </div>
    <h2>4投の抽出スケジュール</h2>
    <table aria-label="4投の抽出スケジュール">
      <thead><tr><th scope="col">投湯</th><th scope="col">開始</th><th scope="col">注ぐ量</th><th scope="col">累計</th></tr></thead>
      <tbody id="schedule">
        <tr><td>1投目</td><td>0:00</td><td>46.5g</td><td>46.5g</td></tr>
        <tr><td>2投目</td><td>0:40</td><td>77.5g</td><td>124g</td></tr>
        <tr><td>3投目</td><td>1:20</td><td>93g</td><td>217g</td></tr>
        <tr><td>4投目</td><td>2:00</td><td>93g</td><td>310g</td></tr>
      </tbody>
    </table>
  </section>

  <section id="panel-press" role="tabpanel" aria-labelledby="tab-press" hidden>
    <div class="summary" aria-live="polite" aria-atomic="true">
      <div class="summary-label">総湯量｜粉湯比 1:16.5</div>
      <div class="summary-value" id="press-total">330g</div>
    </div>
    <h2>フレンチプレスの抽出手順</h2>
    <div class="press-grid" role="table" aria-label="フレンチプレスの抽出手順">
      <div class="press-grid-row press-grid-head" role="row">
        <div role="columnheader">時刻</div><div role="columnheader">操作</div>
      </div>
      <div class="press-grid-row" role="row">
        <div role="cell">準備</div><div role="cell">予熱後、豆を入れ0gに</div>
      </div>
      <div class="press-grid-row" role="row">
        <div role="cell">0:00</div><div role="cell"><strong id="press-pour">330g</strong>を注ぎ、軽く混ぜる</div>
      </div>
      <div class="press-grid-row" role="row">
        <div role="cell">4:00</div><div role="cell">表面の粉を優しく崩す</div>
      </div>
      <div class="press-grid-row" role="row">
        <div role="cell">7:00</div><div role="cell">静かに下げて注ぐ</div>
      </div>
    </div>
  </section>
  <noscript><p class="error">自動計算にはJavaScriptが必要です。Safariなどで開いてください。</p></noscript>
</main>
<script>
(function () {
  'use strict';
  var input=document.getElementById('beans');
  var dripTotal=document.getElementById('drip-total');
  var schedule=document.getElementById('schedule');
  var pressTotal=document.getElementById('press-total');
  var pressPour=document.getElementById('press-pour');
  var error=document.getElementById('inputError');
  var rows=Array.prototype.slice.call(schedule.querySelectorAll('tr'));
  var times=['0:00','0:40','1:20','2:00'];
  var ratios=[.15,.40,.70,1];
  function r1(n){return Math.round((n + Number.EPSILON)*10)/10;}
  function gram(n){return (Math.abs(n-Math.round(n))<.00001?String(Math.round(n)):n.toFixed(1))+'g';}
  function render(){
    var s=input.value.trim(), beans=Number(s), valid=s!==''&&Number.isFinite(beans)&&beans>=1&&beans<=100;
    error.hidden=valid;
    error.textContent=valid?'':'豆量は1〜100gで入力してください。';
    if(!valid){
      dripTotal.textContent='—';pressTotal.textContent='—';pressPour.textContent='—';
      rows.forEach(function(row){row.cells[2].textContent='—';row.cells[3].textContent='—';});
      return;
    }
    var dripWater=r1(beans*15.5),last=0;
    dripTotal.textContent=gram(dripWater);
    for(var i=0;i<4;i++){
      var cumulative=i===3?dripWater:r1(dripWater*ratios[i]);
      rows[i].cells[0].textContent=(i+1)+'投目';
      rows[i].cells[1].textContent=times[i];
      rows[i].cells[2].textContent=gram(r1(cumulative-last));
      rows[i].cells[3].textContent=gram(cumulative);
      last=cumulative;
    }
    var water=r1(beans*16.5);
    pressTotal.textContent=gram(water);
    pressPour.textContent=gram(water);
  }
  var tabs=[document.getElementById('tab-drip'),document.getElementById('tab-press')];
  var panels=[document.getElementById('panel-drip'),document.getElementById('panel-press')];
  function selectTab(which,shouldFocus){
    for(var i=0;i<tabs.length;i++){
      var active=i===which;
      tabs[i].setAttribute('aria-selected',active?'true':'false');
      tabs[i].tabIndex=active?0:-1;
      panels[i].hidden=!active;
    }
    if(shouldFocus)tabs[which].focus();
  }
  tabs.forEach(function(tab,i){
    tab.addEventListener('click',function(){selectTab(i,false);});
    tab.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();selectTab((i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length,true);}});
  });
  input.addEventListener('input',render);
  input.addEventListener('change',render);
  render();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f7f5">
<title>コーヒー抽出計算機</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="コーヒー">
<style>
:root {color-scheme:light;--bg:#f7f7f5;--paper:#fff;--text:#131313;--muted:#696966;--border:#dddcd8;--soft:#f1f1ef;--accent:#474c41;--hl:#eef1ea;--hl-line:#8f9f84}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-width:290px;background:var(--bg);color:var(--text);padding:14px 12px 36px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
.card{max-width:720px;margin:0 auto;padding:27px 28px 31px;background:var(--paper);border:1px solid var(--border);border-radius:25px}
h1{font-size:clamp(25px,5.2vw,35px);line-height:1.25;letter-spacing:.008em;font-weight:800;margin:0 0 23px}
h2{font-size:clamp(21px,4.5vw,27px);font-weight:800;margin:28px 0 15px}
h3{font-size:19px;margin:24px 0 12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border-radius:17px;margin-bottom:26px}
.tab{appearance:none;border:0;border-radius:13px;background:transparent;color:var(--muted);font:inherit;font-size:clamp(15px,3.2vw,18px);font-weight:700;padding:14px 5px;cursor:pointer;min-height:48px}
.tab[aria-selected="true"]{color:var(--text);background:#fff;box-shadow:0 1px 5px #00000013}
.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:3px solid #8f9f84;outline-offset:2px}
label{display:block;color:var(--muted);font-size:clamp(17px,3.7vw,21px);font-weight:700;margin-bottom:13px}
#beans{display:block;width:100%;height:71px;padding:0 25px;border:2px solid #d8d8d5;border-radius:100px;background:#fff;color:var(--text);font:inherit;font-size:27px;font-weight:500;outline:none;font-variant-numeric:tabular-nums}
.field{margin:0 0 19px}
.summary{background:var(--soft);border-radius:20px;padding:19px 22px 20px;margin-top:24px}
.summary-label{font-size:18px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ratio{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:inherit;font-weight:400;color:inherit}
.ratio select{appearance:none;-webkit-appearance:none;font:inherit;font-size:17px;font-weight:700;color:var(--text);background:#fff;border:1.5px solid #d3d3cf;border-radius:100px;padding:7px 30px 7px 13px;min-height:40px;background-image:linear-gradient(45deg,transparent 50%,#696966 50%),linear-gradient(135deg,#696966 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.memo{margin-top:24px}
.memo label{font-size:16px;margin-bottom:8px}
.memo textarea{display:block;width:100%;border:1.5px solid #d8d8d5;border-radius:16px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;color:var(--text);background:#fff;resize:vertical}
.memo-note{margin:6px 2px 0;font-size:13px;color:var(--muted)}
.summary-value{font-size:clamp(38px,7vw,51px);font-weight:800;line-height:1.18;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;table-layout:fixed}
th,td{padding:17px 4px;border-bottom:1px solid #dededb;font-size:clamp(15px,3.4vw,22px);white-space:nowrap}
th{border-bottom:2px solid var(--border);font-weight:750;text-align:left}
th:nth-child(1),td:nth-child(1){width:25%}
th:nth-child(2),td:nth-child(2){width:19%}
th:nth-child(3),td:nth-child(3){width:28%;text-align:right}
th:nth-child(4),td:nth-child(4){width:28%;text-align:right}
tbody tr:last-child td{border-bottom:none}
.error{margin:12px 0 0;font-size:14px;color:#a34531;line-height:1.5}
[hidden]{display:none!important}
@media(max-width:440px){.card{padding:24px 16px 23px;border-radius:22px}h1{margin-bottom:22px}#beans{height:70px;padding:0 23px;font-size:25px}.summary{margin-top:22px;padding:18px 19px}th,td{padding:15px 1px}}
@media(max-width:350px){.card{padding:20px 12px}th,td{font-size:14px}}
/* Separate grid prevents the four-column hand-drip table rules from affecting French press. */
.press-grid{width:100%;min-width:0;font-variant-numeric:tabular-nums}
.press-grid-row{display:grid;grid-template-columns:22% minmax(0,1fr);align-items:center;width:100%;min-width:0;border-bottom:1px solid #dededb}
.press-grid-row:last-child{border-bottom:0}
.press-grid-head{border-bottom:2px solid var(--border);font-weight:750}
.press-grid-row>[role]{min-width:0;padding:17px 4px;font-size:clamp(15px,3.4vw,22px);line-height:1.35}
.press-grid-row>[role]:last-child{white-space:normal;overflow-wrap:anywhere;word-break:normal}
.press-grid-row>[role]:first-child{white-space:nowrap}
@media(max-width:350px){.press-grid-row>[role]{font-size:14px;padding:14px 3px}}
/* Brew timer: the current step is highlighted, finished steps are dimmed. */
#schedule tr.is-current td,.press-grid-row.is-current{background:var(--hl);font-weight:750}
#schedule tr.is-current td:first-child{box-shadow:inset 4px 0 0 var(--hl-line)}
.press-grid-row.is-current{box-shadow:inset 4px 0 0 var(--hl-line)}
#schedule tr.is-done td,.press-grid-row.is-done{color:#9a9a96}
.timer{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;margin-top:26px;background:var(--accent);color:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 20px #0000002a}
.timer-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer-time{font-size:clamp(36px,9vw,50px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer-actions{display:flex;gap:8px;flex-shrink:0}
.btn{appearance:none;border:0;border-radius:100px;font:inherit;font-size:16px;font-weight:750;min-height:46px;padding:0 14px;cursor:pointer;background:#ffffff26;color:#fff;white-space:nowrap}
.btn.primary{background:#fff;color:var(--accent);min-width:88px}
.timer-status{margin-top:10px;font-size:clamp(15px,3.6vw,18px);line-height:1.45;color:#eef0ea;min-height:1.45em}
.timer-next{font-variant-numeric:tabular-nums;font-weight:750;color:#fff}
@media(max-width:440px){.timer{padding:14px 14px}}
@media(max-width:350px){.timer{padding:12px 10px}.timer-time{font-size:30px}.btn{padding:0 10px;font-size:15px}.btn.primary{min-width:72px}}
</style>
</head>
<body>
<main class="card">
  <h1>コーヒー抽出計算機</h1>
  <div class="tabs" role="tablist" aria-label="抽出方法を選択">
    <button class="tab" id="tab-drip" role="tab" aria-controls="panel-drip" aria-selected="true" type="button">ハンドドリップ</button>
    <button class="tab" id="tab-press" role="tab" aria-controls="panel-press" aria-selected="false" tabindex="-1" type="button">フレンチプレス</button>
  </div>
  <div class="field">
    <label for="beans">コーヒー豆の重さ (g)</label>
    <input id="beans" type="number" inputmode="decimal" min="1" max="100" step="0.1" value="20" aria-describedby="inputError">
    <p id="inputError" class="error" role="status" hidden></p>
  </div>

  <section id="panel-drip" role="tabpanel" aria-labelledby="tab-drip">
    <div class="summary" aria-live="polite" aria-atomic="true">
      <div class="summary-label"><span>総湯量</span><label class="ratio" for="ratio-drip">粉湯比 <select id="ratio-drip" aria-label="ハンドドリップの粉湯比"><option value="14">1:14</option><option value="14.5">1:14.5</option><option value="15">1:15</option><option value="15.5" selected>1:15.5（標準）</option><option value="16">1:16</option><option value="16.5">1:16.5</option><option value="17">1:17</option></select></label></div>
      <div class="summary-value" id="drip-total">310g</div>
    </div>
    <h2>4投の抽出スケジュール</h2>
    <table aria-label="4投の抽出スケジュール">
      <thead><tr><th scope="col">投湯</th><th scope="col">開始</th><th scope="col">注ぐ量</th><th scope="col">累計</th></tr></thead>
      <tbody id="schedule">
        <tr><td>1投目</td><td>0:00</td><td>46.5g</td><td>46.5g</td></tr>
        <tr><td>2投目</td><td>0:40</td><td>77.5g</td><td>124g</td></tr>
        <tr><td>3投目</td><td>1:20</td><td>93g</td><td>217g</td></tr>
        <tr><td>4投目</td><td>2:00</td><td>93g</td><td>310g</td></tr>
      </tbody>
    </table>
  </section>

  <section id="panel-press" role="tabpanel" aria-labelledby="tab-press" hidden>
    <div class="summary" aria-live="polite" aria-atomic="true">
      <div class="summary-label"><span>総湯量</span><label class="ratio" for="ratio-press">粉湯比 <select id="ratio-press" aria-label="フレンチプレスの粉湯比"><option value="15">1:15</option><option value="15.5">1:15.5</option><option value="16">1:16</option><option value="16.5" selected>1:16.5（標準）</option><option value="17">1:17</option><option value="17.5">1:17.5</option></select></label></div>
      <div class="summary-value" id="press-total">330g</div>
    </div>
    <h2>フレンチプレスの抽出手順</h2>
    <div class="press-grid" role="table" aria-label="フレンチプレスの抽出手順">
      <div class="press-grid-row press-grid-head" role="row">
        <div role="columnheader">時刻</div><div role="columnheader">操作</div>
      </div>
      <div class="press-grid-row" role="row">
        <div role="cell">準備</div><div role="cell">予熱後、豆を入れ0gに</div>
      </div>
      <div class="press-grid-row press-step" role="row">
        <div role="cell">0:00</div><div role="cell">お湯<strong id="press-pour">330g</strong>を注ぎ、軽く混ぜる</div>
      </div>
      <div class="press-grid-row press-step" role="row">
        <div role="cell">4:00</div><div role="cell">表面の粉を優しく崩す</div>
      </div>
      <div class="press-grid-row press-step" role="row">
        <div role="cell">7:00</div><div role="cell">静かに下げて注ぐ</div>
      </div>
    </div>
  </section>

  <section class="timer" aria-label="抽出タイマー">
    <div class="timer-top">
      <div class="timer-time" id="timer-time" role="timer" aria-live="off">0:00</div>
      <div class="timer-actions">
        <button class="btn primary" id="timer-start" type="button">スタート</button>
        <button class="btn" id="timer-reset" type="button">リセット</button>
      </div>
    </div>
    <div class="timer-status" id="timer-status" aria-live="polite"></div>
  </section>
    <div class="memo" id="memo-box-drip">
      <label for="memo-drip">メモ（湯温・挽き目・豆など）</label>
      <textarea id="memo-drip" rows="3" placeholder="例：88℃、中細挽き、ケニア深煎り。酸味なし・甘み強め"></textarea>
      <p class="memo-note">このiPhone（ブラウザ）にだけ保存されます</p>
    </div>
    <div class="memo" id="memo-box-press" hidden>
      <label for="memo-press">メモ（湯温・挽き目・豆など）</label>
      <textarea id="memo-press" rows="3" placeholder="例：沸騰直後、粗挽き。4分で崩してから7分"></textarea>
      <p class="memo-note">このiPhone（ブラウザ）にだけ保存されます</p>
    </div>
  <noscript><p class="error">自動計算にはJavaScriptが必要です。Safariなどで開いてください。</p></noscript>
</main>
<script>
(function () {
  'use strict';
  var STORE_KEY='coffeeCalc.v1';
  var input=document.getElementById('beans');
  var dripTotal=document.getElementById('drip-total');
  var schedule=document.getElementById('schedule');
  var pressTotal=document.getElementById('press-total');
  var pressPour=document.getElementById('press-pour');
  var error=document.getElementById('inputError');
  var rows=Array.prototype.slice.call(schedule.querySelectorAll('tr'));
  var pressRows=Array.prototype.slice.call(document.querySelectorAll('.press-step'));
  var times=['0:00','0:40','1:20','2:00'];
  var ratios=[.15,.40,.70,1];
  var ratioDrip=document.getElementById('ratio-drip');
  var ratioPress=document.getElementById('ratio-press');
  var memoDrip=document.getElementById('memo-drip');
  var memoPress=document.getElementById('memo-press');
  var current={drip:[],press:0};

  // Saved settings live only in this browser; every access is guarded because storage can be unavailable.
  function loadSettings(){
    try{var raw=localStorage.getItem(STORE_KEY);return raw?JSON.parse(raw)||{}:{};}catch(e){return {};}
  }
  function saveSettings(patch){
    try{var s=loadSettings();for(var k in patch){s[k]=patch[k];}localStorage.setItem(STORE_KEY,JSON.stringify(s));}catch(e){}
  }

  function r1(n){return Math.round((n + Number.EPSILON)*10)/10;}
  function gram(n){return (Math.abs(n-Math.round(n))<.00001?String(Math.round(n)):n.toFixed(1))+'g';}
  function clock(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+('0'+sec%60).slice(-2);}

  function render(){
    var s=input.value.trim(), beans=Number(s), valid=s!==''&&Number.isFinite(beans)&&beans>=1&&beans<=100;
    error.hidden=valid;
    error.textContent=valid?'':'豆量は1〜100gで入力してください。';
    if(!valid){
      dripTotal.textContent='—';pressTotal.textContent='—';pressPour.textContent='—';
      rows.forEach(function(row){row.cells[2].textContent='—';row.cells[3].textContent='—';});
      current={drip:[],press:0};
      updateTimerView();
      return;
    }
    saveSettings({beans:s});
    var dripWater=r1(beans*Number(ratioDrip.value)),last=0,cum=[];
    dripTotal.textContent=gram(dripWater);
    for(var i=0;i<4;i++){
      var cumulative=i===3?dripWater:r1(dripWater*ratios[i]);
      rows[i].cells[0].textContent=(i+1)+'投目';
      rows[i].cells[1].textContent=times[i];
      rows[i].cells[2].textContent=gram(r1(cumulative-last));
      rows[i].cells[3].textContent=gram(cumulative);
      cum.push(cumulative);
      last=cumulative;
    }
    var water=r1(beans*Number(ratioPress.value));
    pressTotal.textContent=gram(water);
    pressPour.textContent=gram(water);
    current={drip:cum,press:water};
    updateTimerView();
  }

  /* ---------- Brew timer ---------- */
  var timeEl=document.getElementById('timer-time');
  var statusEl=document.getElementById('timer-status');
  var startBtn=document.getElementById('timer-start');
  var resetBtn=document.getElementById('timer-reset');
  var mode='drip';
  var running=false,startedAt=0,carried=0,tickId=null,wakeLock=null;

  var STEPS={
    drip:[0,40,80,120],
    press:[0,240,420]
  };
  function stepText(m,i){
    if(m==='drip'){
      var c=current.drip[i];
      return (i+1)+'投目を注ぐ'+(c!=null?'（累計'+gram(c)+'まで）':'');
    }
    return ['お湯'+(current.press?gram(current.press):'')+'を注ぎ、軽く混ぜる','表面の粉を優しく崩す','静かに下げて注ぐ'][i];
  }
  function idleText(m){
    if(m==='drip')return 'スタートで1投目'+(current.drip[0]!=null?'（'+gram(current.drip[0])+'）':'')+'を注ぎます';
    return '豆を入れたら、スタートでお湯を注ぎます';
  }
  function elapsed(){return carried+(running?(Date.now()-startedAt)/1000:0);}
  function stepIndex(m,sec){
    var steps=STEPS[m],idx=-1;
    for(var i=0;i<steps.length;i++){if(sec>=steps[i])idx=i;}
    return idx;
  }
  function highlight(m,idx,active){
    var list=m==='drip'?rows:pressRows;
    list.forEach(function(el,i){
      el.classList.toggle('is-current',active&&i===idx);
      el.classList.toggle('is-done',active&&i<idx);
    });
  }
  function clearHighlights(){highlight('drip',-1,false);highlight('press',-1,false);}

  function updateTimerView(){
    var sec=elapsed(),active=running||carried>0;
    timeEl.textContent=clock(sec);
    if(!active){
      clearHighlights();
      statusEl.textContent=idleText(mode);
      return;
    }
    var steps=STEPS[mode],idx=stepIndex(mode,sec);
    highlight(mode,idx,true);
    var html=stepText(mode,idx);
    if(idx<steps.length-1){
      html+='<br><span class="timer-next">次まであと '+clock(Math.ceil(steps[idx+1]-sec))+'</span>';
    }else if(mode==='drip'){
      html+='<br><span class="timer-next">注ぎ終わり。落ち切ったら止めてください</span>';
    }
    statusEl.innerHTML=html;
  }

  function tick(){updateTimerView();}

  function requestWake(){
    try{
      if('wakeLock' in navigator&&document.visibilityState==='visible'){
        navigator.wakeLock.request('screen').then(function(l){wakeLock=l;}).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWake(){try{if(wakeLock){wakeLock.release();}}catch(e){}wakeLock=null;}

  function start(){
    if(carried===0){
      // Bring the schedule and the timer into view together when a brew starts.
      try{document.querySelector('.timer').scrollIntoView({behavior:'smooth',block:'end'});}catch(e){}
    }
    startedAt=Date.now();running=true;
    tickId=setInterval(tick,200);
    startBtn.textContent='一時停止';
    requestWake();
    updateTimerView();
  }
  function pause(){
    carried=elapsed();running=false;
    clearInterval(tickId);tickId=null;
    startBtn.textContent='再開';
    releaseWake();
    updateTimerView();
  }
  function reset(){
    running=false;carried=0;
    clearInterval(tickId);tickId=null;
    startBtn.textContent='スタート';
    releaseWake();
    updateTimerView();
  }
  startBtn.addEventListener('click',function(){running?pause():start();});
  resetBtn.addEventListener('click',reset);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){
      if(running){requestWake();}
      updateTimerView();
    }
  });

  /* ---------- Tabs ---------- */
  var tabs=[document.getElementById('tab-drip'),document.getElementById('tab-press')];
  var panels=[document.getElementById('panel-drip'),document.getElementById('panel-press')];
  function selectTab(which,shouldFocus){
    for(var i=0;i<tabs.length;i++){
      var active=i===which;
      tabs[i].setAttribute('aria-selected',active?'true':'false');
      tabs[i].tabIndex=active?0:-1;
      panels[i].hidden=!active;
    }
    var next=which===1?'press':'drip';
    document.getElementById('memo-box-drip').hidden=which===1;
    document.getElementById('memo-box-press').hidden=which!==1;
    if(next!==mode){mode=next;reset();}
    saveSettings({tab:mode});
    if(shouldFocus)tabs[which].focus();
  }
  tabs.forEach(function(tab,i){
    tab.addEventListener('click',function(){selectTab(i,false);});
    tab.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();selectTab((i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length,true);}});
  });

  // Restore the last bean amount and method.
  var saved=loadSettings();
  if(saved.beans){var b=Number(saved.beans);if(Number.isFinite(b)&&b>=1&&b<=100)input.value=saved.beans;}
  if(saved.tab==='press')selectTab(1,false);

  function pickRatio(sel,val){if(val&&Array.prototype.some.call(sel.options,function(o){return o.value===String(val);}))sel.value=String(val);}
  pickRatio(ratioDrip,saved.ratioDrip);pickRatio(ratioPress,saved.ratioPress);
  ratioDrip.addEventListener('change',function(){saveSettings({ratioDrip:ratioDrip.value});render();});
  ratioPress.addEventListener('change',function(){saveSettings({ratioPress:ratioPress.value});render();});
  memoDrip.value=typeof saved.memoDrip==='string'?saved.memoDrip:'';
  memoPress.value=typeof saved.memoPress==='string'?saved.memoPress:'';
  memoDrip.addEventListener('input',function(){saveSettings({memoDrip:memoDrip.value});});
  memoPress.addEventListener('input',function(){saveSettings({memoPress:memoPress.value});});

  input.addEventListener('input',render);
  input.addEventListener('change',render);
  render();
})();
</script>
</body>
</html>
